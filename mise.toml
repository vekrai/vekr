[tools]
go = "1.27.3"
gomigrate = "4.20.1"
node = "26.13.0"

[tasks.dev]
description = "Run the server"
run = "go run ./cmd/server"

[tasks."db:migrate"]
description = "Run database migrations"
run = "migrate -path db/migrations -database \"postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_HOST}:5432/vekr_development?sslmode=disable\" up"

[tasks."db:seed"]
description = "Seed the database"
run = "go run ./cmd/seed"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."
