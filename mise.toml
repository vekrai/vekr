[tools]
go = "1.27.3"
gomigrate = "4.20.1"
node = "26.13.0"
"go:github.com/a-h/templ/cmd/templ" = "0.3.1100"
"github:tailwindlabs/tailwindcss" = "4.3.3"

[tasks."templates:generate"]
description = "Compile .templ files into Go"
run = "templ generate"

[tasks."css:build"]
description = "Build Tailwind CSS"
run = "tailwindcss -i web/static/css/input.css -o web/static/css/app.css --minify"

[tasks."js:vendor"]
description = "Re-fetch vendored browser JS from the versions pinned in package.json"
run = "./scripts/vendor-js.sh"

[tasks.dev]
description = "Run the server with live reload on http://localhost:8000"
depends = ["templates:generate", "css:build"]
run = """
proxy_port=${PORT:-8000}
export PORT=${APP_PORT:-8001}
tailwindcss -i web/static/css/input.css -o web/static/css/app.css --watch=always &
trap 'kill $! 2>/dev/null' EXIT INT TERM
templ generate --watch \
  --watch-pattern '(.+\\.go$)|(.+\\.templ$)|(.+\\.yaml$)|(.+\\.txt$)|(.+\\.css$)|(.+\\.js$)' \
  --proxy "http://localhost:$PORT" --proxyport "$proxy_port" --open-browser=false \
  --cmd 'go run ./cmd/server'
"""

[tasks.serve]
description = "Run the server once, without watching"
depends = ["templates:generate", "css:build"]
run = "go run ./cmd/server"

[tasks."db:migrate"]
description = "Run database migrations"
run = "migrate -path db/migrations -database \"postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_HOST}:5432/vekr_${APP_ENV:-development}?sslmode=disable\" up"

[tasks."db:seed"]
description = "Seed the database"
run = "go run ./cmd/seed"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."
env = { APP_ENV = "test" }
