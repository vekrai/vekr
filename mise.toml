[tools]
go = "1.27.3"
gomigrate = "4.20.1"
node = "26.13.0"
"go:github.com/a-h/templ/cmd/templ" = "0.3.1100"

[tasks."templates:generate"]
description = "Compile .templ files into Go"
run = "templ generate"

[tasks.dev]
description = "Run the server"
depends = ["templates:generate"]
run = "go run ./cmd/server"

[tasks."db:migrate"]
description = "Run database migrations"
run = "migrate -path db/migrations -database \"postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_HOST}:5432/vekr_${APP_ENV:-development}?sslmode=disable\" up"

[tasks."db:seed"]
description = "Seed the database"
run = "go run ./cmd/seed"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."
env = { APP_ENV = "test" }
